[package]
name = "carino-desktop"
version = "1.5.0"
edition = "2021"
description = "Carino for Windows: the same Carino as on the phone, paired with it over your Wi-Fi."
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.13"
carino-sync-listener = { path = "../sync-listener" }

tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
