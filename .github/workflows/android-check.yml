name: Android check
# Builds the APK and opens it on an Android emulator. Fails if the app crashes or Carino's
# in-app server doesn't start. Runs on app changes and can be started manually.
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'app/**', 'mobile/**', 'src/**', 'server/**', 'vite.mobile.config.ts', 'package.json', '.github/workflows/android-check.yml']

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build the app bundle
        run: npm run build
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '9.8.1' }
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Start the stand-in AI service and install the test driver
        run: |
          npm i --no-save playwright@1.63.0
          nohup node android/qa/fake-ai.mjs 9996 > fake-ai.log 2>&1 &
          sleep 1 && curl -sf http://127.0.0.1:9996/v1/models
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Opens the app, then drives it through every phone-only feature (android/qa/device-test.cjs).
          script: |
            bash android/launch-test.sh android/app/build/outputs/apk/debug/app-debug.apk
            node android/qa/device-test.cjs app.carino Carino http://10.0.2.2:9996/v1
      # The log and screenshot are a convenience; a full artifact quota must not fail the check.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: emulator
          path: |
            logcat.txt
            screenshot.png
            device-test/
            fake-ai.log
          if-no-files-found: ignore

  # The Flutter edition (app/): the same engine with Flutter screens. Fails unless the engine starts
  # and the Flutter screens reach it through the link (mobile/flutter-link.ts).
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build the engine bundle
        run: npm run build
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      # The same Flutter as the project was made with (app/pubspec.lock), so builds don't drift.
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.9', channel: stable, cache: true }
      - name: Flutter tests
        working-directory: app
        run: flutter test
      - name: Build APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash android/launch-test.sh app/build/app/outputs/flutter-apk/app-debug.apk
            sleep 6; adb logcat -d > logcat-flutter.txt; grep -q "Carino: Flutter screens ready" logcat-flutter.txt || (echo "The Flutter screens did not reach the engine."; grep -E "flutter|Carino" logcat-flutter.txt | tail -40; exit 1)
            adb exec-out screencap -p > screenshot-flutter.png || true
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: emulator-flutter
          path: |
            logcat.txt
            logcat-flutter.txt
            screenshot.png
            screenshot-flutter.png
          if-no-files-found: ignore
