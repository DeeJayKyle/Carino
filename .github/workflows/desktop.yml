# Carino for Windows: the Flutter app (app/) with the same engine, built on a Windows runner into
# an installer (Carino-Setup-<version>.exe). Runs when started by hand, for a version tag, or when
# the Flutter app changes (build check only).
name: Carino for Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Attach the installer to this release (e.g. 1.6.0); leave empty to only build'
        required: false
  push:
    tags: ['v*']
    branches: [main]
    paths: ['app/**', 'mobile/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build the engine bundle
        run: npm run build:desktop
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.9', channel: stable, cache: true }
      - name: Flutter tests (including the Windows host's folders, apps and sync listener)
        working-directory: app
        run: flutter test
      - name: Version
        shell: bash
        env:
          V: ${{ inputs.version || github.ref_name }}
        run: |
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then V=$(grep -m1 '^version:' app/pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/'); fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Build Carino for Windows
        working-directory: app
        shell: bash
        run: flutter build windows --release --build-name "$V"
      - name: Check the engine is bundled
        shell: bash
        run: test -f app/build/windows/x64/runner/Release/engine/index.html
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:V" "/DSourceDir=$PWD\app\build\windows\x64\runner\Release" "/O$PWD" app\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: carino-windows
          path: Carino-Setup-*.exe
      - name: Attach to the release
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$V" Carino-Setup-*.exe --repo "${{ github.repository }}" --clobber
