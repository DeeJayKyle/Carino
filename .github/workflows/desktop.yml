# Carino for Windows: builds the installer (NSIS .exe and .msi) on a Windows runner.
# Runs only when started by hand or for a version tag, never on an ordinary push.
name: Carino for Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Attach the installers to this release (e.g. 1.5.0); leave empty to only build'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Tests (the same engine runs in the Windows app)
        run: npm test
      - name: Sync listener tests
        working-directory: desktop/sync-listener
        run: cargo test
      - name: Build the installer
        working-directory: desktop/app
        # Tauri runs the web build itself (beforeBuildCommand, from desktop/).
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: carino-windows
          path: |
            desktop/app/target/release/bundle/nsis/*.exe
            desktop/app/target/release/bundle/msi/*.msi
      - name: Attach to the release
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version || github.ref_name }}
        run: |
          V="${V#v}"
          gh release upload "v$V" desktop/app/target/release/bundle/nsis/*.exe desktop/app/target/release/bundle/msi/*.msi --repo "${{ github.repository }}" --clobber
