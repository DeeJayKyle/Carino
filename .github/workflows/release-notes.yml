name: Release notes
# Rewrites the notes of an existing release from docs/release-notes/v<version>.md, without rebuilding.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (e.g. 1.7.0)'
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Update the notes
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: |
          SHA=$(git rev-list -n 1 "v$V")
          bash .github/scripts/release-notes.sh "$V" "$SHA"
          gh release edit "v$V" --repo "${{ github.repository }}" --notes-file notes.md
