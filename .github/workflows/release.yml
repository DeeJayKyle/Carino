name: Release
# Builds the signed Carino-<version>.apk and publishes it as a GitHub Release.
# Start it from the Actions tab (Run workflow → version), or by pushing a tag like v1.0.0.
# Needs two repository secrets: CARINO_KEYSTORE_B64 (the signing key, base64) and
# CARINO_KEYSTORE_PASSWORD. Every release must use the same key, or phones can't update.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: echo "V=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: The sign-in helper's address (for one-tap sign-in)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain // empty')
            if [ -n "$sub" ]; then echo "VITE_CARINO_HELPER=https://carino-auth.$sub.workers.dev" >> "$GITHUB_ENV"; echo "Helper: https://carino-auth.$sub.workers.dev"; fi
          fi
      - run: npm run build
      - run: npm test
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '9.8.1' }
      - name: Build signed APK
        working-directory: android
        env:
          CARINO_KEYSTORE_PASSWORD: ${{ secrets.CARINO_KEYSTORE_PASSWORD }}
        run: |
          test -n "${{ secrets.CARINO_KEYSTORE_B64 }}" || { echo "Missing CARINO_KEYSTORE_B64 secret"; exit 1; }
          echo "${{ secrets.CARINO_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/carino.p12"
          export CARINO_KEYSTORE_FILE="$RUNNER_TEMP/carino.p12"
          gradle assembleRelease --no-daemon -PappVersion="$V"
          rm -f "$RUNNER_TEMP/carino.p12"
          cp app/build/outputs/apk/release/app-release.apk "../Carino-$V.apk"
      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs "Carino-$V.apk" | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '## Carino %s\n\nDownload `Carino-%s.apk` on your Android phone and open it (allow *Install unknown apps* when asked). Carino runs entirely on your phone; on first start, pick one of the free AI services (Gemini, Groq, OpenRouter and more), paste its key, and tap *Test speed* to use the fastest model and paste its key.\n\nBuilt from commit %s.\n' "$V" "$V" "${{ github.sha }}" > notes.md
          if [ -f "docs/release-notes/v$V.md" ]; then cat "docs/release-notes/v$V.md" >> notes.md; fi
          gh release create "v$V" "Carino-$V.apk" --repo "${{ github.repository }}" --title "Carino $V" --notes-file notes.md --target "${{ github.sha }}" || \
            gh release upload "v$V" "Carino-$V.apk" --repo "${{ github.repository }}" --clobber
